<script>
(function(){
  const START_BALANCE = 5000;
  let balance = START_BALANCE;

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  let tgUser = null;
  if(tg){
    try{ tg.ready(); tg.expand();
      tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    }catch(e){}
  }
  const userKey = tgUser && tgUser.id ? ('jager_profile_' + tgUser.id) : 'jager_profile_guest';

  // ==================== BACKEND API ====================
  const API_BASE_URL = 'https://jager-casino.onrender.com';

  const SESSION_KEY = 'jager_session_v1';
  const ADMIN_TOKEN_KEY = 'jager_admin_token_v1';
  const loadSession = ()=>{ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;} };
  const saveSession = s=>{ try{localStorage.setItem(SESSION_KEY, JSON.stringify(s));}catch(e){} };
  let session = loadSession();

  async function apiRegister(name, password){
    const res = await fetch(API_BASE_URL + '/api/register', {
      method: 'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, password, tg_id: tgUser ? String(tgUser.id) : null})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail || 'Ошибка регистрации');
    return data;
  }

  async function apiAdminLogin(password){
    const res = await fetch(API_BASE_URL + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail || 'Неверный пароль');
    return data.token;
  }

  function apiActivity(text){
    if(!API_BASE_URL || !session) return;
    fetch(API_BASE_URL + '/api/activity', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token: session.token, activity: text})
    }).catch(()=>{});
  }

  // Ключевая функция: синхронизация с сервером + получение начислений админа
  async function apiSync(){
    if(!API_BASE_URL || !session) return;
    try{
      const res = await fetch(API_BASE_URL + '/api/sync', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          token: session.token, balance,
          games: stats.games, wins: stats.wins, losses: stats.losses,
          total_win: stats.totalWin, total_lose: stats.totalLose,
          total_wagered: stats.totalWagered || 0, best_win: stats.bestWin
        })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && typeof data.balance === 'number'){
        // Если сервер говорит что баланс больше — значит пришли начисления админа
        if(data.balance > balance){
          balance = data.balance;
          renderBalance();
          saveProfile();
          if(data.credited > 0){
            toast('💎 Начислено +' + fmt(data.credited) + ' фишек');
          }
        }
      }
    }catch(e){}
  }

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ru-RU');

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 2400);
  }

  function renderBalance(){ $('balanceDisplay').textContent = fmt(balance); }

  function defaultStats(){
    return {games:0, wins:0, losses:0, totalWin:0, totalLose:0, bestWin:0, streak:0, totalEarned:0, totalWagered:0, lastGameAt:0};
  }
  function defaultQuests(){ return {adminMsgDone:false, channelDone:false, activityClaimed:[]}; }
  function defaultRefData(){
    return {code:'g'+Math.random().toString(36).slice(2,8), invited:0, active:0, earned:0, referredBy:null, processedStartParam:false};
  }

  let stats = defaultStats();
  let quests = defaultQuests();
  let refData = defaultRefData();

  const ACTIVITY_MILESTONES = Array.from({length:10}, (_,i)=>{
    const step = i+1;
    return {step, games:step*10, coins:step*5000, reward:step*1500};
  });

  const RANKS = [
    {name:'Бронза', emoji:'🥉', min:0},
    {name:'Серебро', emoji:'🥈', min:100000},
    {name:'Золото', emoji:'🥇', min:300000},
    {name:'Платина', emoji:'💎', min:750000},
    {name:'Алмаз', emoji:'', min:1500000},
  ];
  function currentRank(){ let r=RANKS[0]; for(const rank of RANKS){ if(stats.totalEarned >= rank.min) r=rank; } return r; }
  function nextRank(){
    const idx = RANKS.findIndex(r=>r===currentRank());
    return idx < RANKS.length-1 ? RANKS[idx+1] : null;
  }

  function recordRoundResult(betAmount, payout){
    stats.games++;
    stats.totalWagered = (stats.totalWagered||0) + Math.max(0, betAmount);
    stats.lastGameAt = Date.now();
    const net = payout - betAmount;
    if(net > 0){
      stats.wins++; stats.streak++; stats.totalWin += net;
      stats.totalEarned += payout;
      if(net > stats.bestWin) stats.bestWin = net;
    } else {
      stats.losses++; stats.streak = 0; stats.totalLose += Math.abs(net);
    }
    checkActivityQuests();
    renderProfile();
    saveProfile();
    apiSync();
  }

  function loadProfile(){
    try{
      const raw = localStorage.getItem(userKey);
      if(raw){
        const data = JSON.parse(raw);
        balance = typeof data.balance === 'number' ? data.balance : START_BALANCE;
        stats = data.stats ? Object.assign(defaultStats(), data.stats) : defaultStats();
        quests = data.quests ? Object.assign(defaultQuests(), data.quests) : defaultQuests();
        refData = data.refData ? Object.assign(defaultRefData(), data.refData) : defaultRefData();
      } else balance = START_BALANCE;
    }catch(e){ balance = START_BALANCE; }
    renderBalance();
  }

  function saveProfile(){
    try{
      localStorage.setItem(userKey, JSON.stringify({
        balance, stats, quests, refData, updated:Date.now()
      }));
    }catch(e){}
  }

  function changeBalance(delta){
    balance += delta;
    if(balance < 0) balance = 0;
    renderBalance();
    saveProfile();
  }

  loadProfile();

  // ==================== РЕГИСТРАЦИЯ ====================
  function maybeShowRegistration(){
    if(!API_BASE_URL) return;
    if(session && session.token) return;
    $('regOverlay').classList.add('show');
  }
  $('regSubmitBtn').addEventListener('click', async ()=>{
    const name = $('regNameInput').value.trim();
    const password = $('regPasswordInput').value;
    $('regError').textContent = '';
    if(name.length < 2){ $('regError').textContent = 'Введи имя (от 2 символов)'; return; }
    if(password.length < 4){ $('regError').textContent = 'Пароль от 4 символов'; return; }
    try{
      const data = await apiRegister(name, password);
      session = {token: data.token, name: data.name};
      saveSession(session);
      balance = data.balance;
      stats = Object.assign(defaultStats(), {
        games:data.games||0, wins:data.wins||0, losses:data.losses||0,
        totalWin:data.total_win||0, totalLose:data.total_lose||0,
        totalWagered:data.total_wagered||0, bestWin:data.best_win||0
      });
      renderBalance(); renderProfile(); saveProfile();
      $('regOverlay').classList.remove('show');
      toast('Добро пожаловать, '+data.name+'!');
      apiActivity('В меню');
    }catch(e){ $('regError').textContent = e.message || 'Не удалось войти'; }
  });
  maybeShowRegistration();

  // Фоновая синхронизация каждые 15 секунд — это нужно для получения начислений админа
  if(API_BASE_URL){
    setInterval(()=>{ if(session) apiSync(); }, 15000);
  }

  // ... (оставь без изменений: handleReferralStartParam, tgUser рендер, menuBtn логика,
  //       навигация по экранам, quick-bet, getBet, и вся логика игр MINES/ROULETTE/UPGRADE/ROCKET/LADDER/PVP/QUESTS/SHOP/REFERRALS/PROFILE)

  // ==================== ADMIN PANEL (НОВАЯ БЕЗОПАСНАЯ ВЕРСИЯ) ====================
  // ПАРОЛЯ В КОДЕ БОЛЬШЕ НЕТ! Он вводится вручную при логине.
  let adminToken = sessionStorage.getItem(ADMIN_TOKEN_KEY) || null;

  function openAdminLogin(){
    $('adminLoginOverlay').classList.add('show');
    $('adminPasswordInput').value = '';
    $('adminPasswordInput').focus();
  }
  $('adminLoginBtn').addEventListener('click', tryAdminLogin);
  $('adminPasswordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryAdminLogin(); });

  async function tryAdminLogin(){
    const val = $('adminPasswordInput').value;
    if(!val){ toast('Введите пароль'); return; }
    try{
      const token = await apiAdminLogin(val);
      adminToken = token;
      sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
      $('adminLoginOverlay').classList.remove('show');
      openAdminPanel();
      toast('Вход выполнен');
    }catch(e){
      toast('Неверный пароль');
    }
  }

  function openAdminPanel(){
    if(!adminToken){ openAdminLogin(); return; }
    renderAdminPanel();
    $('adminScreen').classList.add('show');
    clearInterval(adminPollTimer);
    if(API_BASE_URL) adminPollTimer = setInterval(()=> renderAdminPlayers(currentAdminView), 5000);
  }
  $('adminCloseBtn').addEventListener('click', ()=>{
    $('adminScreen').classList.remove('show');
    clearInterval(adminPollTimer);
  });
  $('adminLogoutBtn').addEventListener('click', ()=>{
    adminToken = null;
    sessionStorage.removeItem(ADMIN_TOKEN_KEY);
    $('adminScreen').classList.remove('show');
    clearInterval(adminPollTimer);
    toast('Выход из админ-панели выполнен');
  });

  let currentAdminView = 'players';
  let adminPollTimer = null;

  async function renderAdminPlayers(view='players'){
    currentAdminView = view;
    if(!API_BASE_URL || !adminToken) return;

    try{
      const sortParam = view==='balance' ? 'balance' : (view==='games' ? 'games' : 'recent');
      const res = await fetch(API_BASE_URL + '/api/admin/players?admin_token=' + encodeURIComponent(adminToken) + '&sort=' + sortParam);
      if(res.status === 403){ adminToken=null; sessionStorage.removeItem(ADMIN_TOKEN_KEY); openAdminLogin(); return; }
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      $('adminTotalPlayers').textContent = data.total_players;
      $('adminOnlinePlayers').textContent = data.online_now;
      $('adminTotalGames').textContent = data.total_games;
      $('adminTotalWagered').textContent = '◆'+fmt(data.total_wagered);
      let html = '<table class="admin-table"><thead><tr><th>#</th><th>Игрок</th><th>Сейчас</th><th>Баланс</th><th>Игр</th><th>Побед</th><th>Статус</th></tr></thead><tbody>';
      data.players.forEach((p,i)=>{
        html += '<tr><td>'+(i+1)+'</td>'+
          '<td>'+(p.online?'<span class="admin-online-dot"></span>':'')+p.name+'</td>'+
          '<td class="admin-muted">'+p.activity+'</td>'+
          '<td>◆'+fmt(p.balance)+'</td><td>'+p.games+'</td><td>'+p.wins+'</td>'+
          '<td>'+(p.banned?' 🔒':'✅')+'</td></tr>';
      });
      html += '</tbody></table>';
      $('adminPlayersTable').innerHTML = html;
    }catch(e){
      $('adminPlayersTable').innerHTML = '<div class="admin-note">Сервер недоступен ('+API_BASE_URL+')</div>';
    }
  }

  function renderAdminPanel(){
    const q = $('adminQuestQueue');
    q.innerHTML = '';
    const pendingItems = [];
    if(quests.adminMsgDone === 'pending') pendingItems.push({key:'adminMsgDone', label:'Сообщение администратору', reward:1000});
    if(quests.channelDone === 'pending') pendingItems.push({key:'channelDone', label:'Подписка на канал', reward:3000});
    if(pendingItems.length === 0){
      q.innerHTML = '<div class="admin-note">Заявок на проверку нет</div>';
    } else {
      pendingItems.forEach(it=>{
        const row = document.createElement('div'); row.className='admin-row';
        row.innerHTML='<span>'+it.label+' (+'+fmt(it.reward)+')</span><button class="admin-approve-btn" data-key="'+it.key+'" data-reward="'+it.reward+'">Подтвердить</button>';
        q.appendChild(row);
      });
      q.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{
        const key=btn.dataset.key, reward=parseInt(btn.dataset.reward);
        quests[key]=true; changeBalance(reward);
        toast('Задание подтверждено, начислено '+fmt(reward));
        renderQuests(); saveProfile(); renderAdminPanel();
      }));
    }

    const s = $('adminStatsBlock');
    s.innerHTML =
      '<div class="admin-row"><span>ID</span><b>'+(tgUser?tgUser.id:'—')+'</b></div>'+
      '<div class="admin-row"><span>Баланс</span><b>◆'+fmt(balance)+'</b></div>'+
      '<div class="admin-row"><span>Игр сыграно</span><b>'+stats.games+'</b></div>'+
      '<div class="admin-row"><span>Ставок на сумму</span><b>◆'+fmt(stats.totalWagered||0)+'</b></div>'+
      '<div class="admin-row"><span>Победы / поражения</span><b>'+stats.wins+' / '+stats.losses+'</b></div>'+
      '<div class="admin-row"><span>Win Rate</span><b>'+(stats.games>0?Math.round(stats.wins/stats.games*100):0)+'%</b></div>';
    renderAdminPlayers('players');
    document.querySelectorAll('.admin-tab').forEach(tab=>{
      tab.onclick=()=>{ document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active')); tab.classList.add('active'); renderAdminPlayers(tab.dataset.adminView); };
    });
  }

  $('adminGiveBtn').addEventListener('click', async ()=>{
    const target = $('adminGiveTarget').value.trim();
    const amount = parseInt($('adminGiveAmount').value);
    if(!target){ toast('Укажите имя игрока'); return; }
    if(!amount || amount <= 0){ toast('Укажите сумму'); return; }
    if(!adminToken){ toast('Сначала войдите в админ-панель'); return; }

    try{
      const res = await fetch(API_BASE_URL + '/api/admin/give', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({admin_token: adminToken, name: target, amount})
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.detail || 'Ошибка');
      toast('Игроку '+target+' начислено ◆'+fmt(amount)+'. Он увидит фишки при следующей синхронизации (до 15 сек)');
      $('adminGiveTarget').value=''; $('adminGiveAmount').value='';
      renderAdminPlayers(currentAdminView);
    }catch(e){ toast('Не удалось начислить: '+e.message); }
  });

  $('adminBanBtn').addEventListener('click', async ()=>{
    const target = $('adminBanTarget').value.trim();
    const minutes = parseInt($('adminBanMinutes').value);
    if(!target){ toast('Укажите имя'); return; }
    if(isNaN(minutes)){ toast('Укажите минуты'); return; }
    if(!adminToken){ toast('Сначала войдите'); return; }
    try{
      const res = await fetch(API_BASE_URL + '/api/admin/ban', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({admin_token: adminToken, name: target, minutes})
      });
      if(!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || 'Ошибка');
      toast('Игрок '+target+' забанен');
      renderAdminPlayers(currentAdminView);
    }catch(e){ toast('Не удалось: '+e.message); }
  });

})();
</script>
