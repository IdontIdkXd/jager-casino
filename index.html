<script>
(function(){
  const START_BALANCE = 5000;
  let balance = START_BALANCE;

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  let tgUser = null;
  if(tg){
    try{ tg.ready(); tg.expand();
      tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    }catch(e){}
  }
  const userKey = tgUser && tgUser.id ? ('jager_profile_' + tgUser.id) : 'jager_profile_guest';

  const API_BASE_URL = 'https://jager-casino.onrender.com';
  const SESSION_KEY = 'jager_session_v1';
  const ADMIN_TOKEN_KEY = 'jager_admin_token_v1';
  const loadSession = ()=>{ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;} };
  const saveSession = s=>{ try{localStorage.setItem(SESSION_KEY, JSON.stringify(s));}catch(e){} };
  let session = loadSession();

  async function apiRegister(name, password){
    const res = await fetch(API_BASE_URL + '/api/register', {
      method: 'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, password, tg_id: tgUser ? String(tgUser.id) : null})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail || 'Ошибка регистрации');
    return data;
  }
  async function apiAdminLogin(password){
    const res = await fetch(API_BASE_URL + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail || 'Неверный пароль');
    return data.token;
  }
  function apiActivity(text){
    if(!API_BASE_URL || !session) return;
    fetch(API_BASE_URL + '/api/activity', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token: session.token, activity: text})
    }).catch(()=>{});
  }
  async function apiSync(){
    if(!API_BASE_URL || !session) return;
    try{
      const res = await fetch(API_BASE_URL + '/api/sync', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          token: session.token, balance,
          games: stats.games, wins: stats.wins, losses: stats.losses,
          total_win: stats.totalWin, total_lose: stats.totalLose,
          total_wagered: stats.totalWagered || 0, best_win: stats.bestWin
        })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && typeof data.balance === 'number'){
        if(data.balance > balance){
          balance = data.balance;
          renderBalance();
          saveProfile();
          if(data.credited > 0){
            toast('💎 Начислено +' + fmt(data.credited) + ' фишек');
          }
        }
      }
    }catch(e){}
  }

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ru-RU');

  function toast(msg){
    const t = $('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 2400);
  }

  function renderBalance(){
    const el = $('balanceDisplay');
    if (el) el.textContent = fmt(balance);
    const topBadge = $('topRankBadge');
    if (topBadge) topBadge.textContent = currentRank().emoji + ' ' + currentRank().name;
  }

  function defaultStats(){
    return {games:0, wins:0, losses:0, totalWin:0, totalLose:0, bestWin:0, streak:0, totalEarned:0, totalWagered:0, lastGameAt:0};
  }
  function defaultQuests(){ return {adminMsgDone:false, channelDone:false, activityClaimed:[]}; }
  function defaultRefData(){
    return {code:'g'+Math.random().toString(36).slice(2,8), invited:0, active:0, earned:0, referredBy:null, processedStartParam:false};
  }

  let stats = defaultStats();
  let quests = defaultQuests();
  let refData = defaultRefData();

  const ACTIVITY_MILESTONES = Array.from({length:10}, (_,i)=>{
    const step = i+1;
    return {step, games:step*10, coins:step*5000, reward:step*1500};
  });
  const RANKS = [
    {name:'Бронза', emoji:'🥉', min:0},
    {name:'Серебро', emoji:'🥈', min:100000},
    {name:'Золото', emoji:'🥇', min:300000},
    {name:'Платина', emoji:'💎', min:750000},
    {name:'Алмаз', emoji:'', min:1500000},
  ];
  function currentRank(){ let r=RANKS[0]; for(const rank of RANKS){ if(stats.totalEarned >= rank.min) r=rank; } return r; }
  function nextRank(){
    const idx = RANKS.findIndex(r=>r===currentRank());
    return idx < RANKS.length-1 ? RANKS[idx+1] : null;
  }

  function recordRoundResult(betAmount, payout){
    stats.games++;
    stats.totalWagered = (stats.totalWagered||0) + Math.max(0, betAmount);
    stats.lastGameAt = Date.now();
    const net = payout - betAmount;
    if(net > 0){
      stats.wins++; stats.streak++; stats.totalWin += net;
      stats.totalEarned += payout;
      if(net > stats.bestWin) stats.bestWin = net;
    } else {
      stats.losses++; stats.streak = 0; stats.totalLose += Math.abs(net);
    }
    checkActivityQuests();
    renderProfile();
    saveProfile();
    apiSync();
  }

  function loadProfile(){
    try{
      const raw = localStorage.getItem(userKey);
      if(raw){
        const data = JSON.parse(raw);
        balance = typeof data.balance === 'number' ? data.balance : START_BALANCE;
        stats = data.stats ? Object.assign(defaultStats(), data.stats) : defaultStats();
        quests = data.quests ? Object.assign(defaultQuests(), data.quests) : defaultQuests();
        refData = data.refData ? Object.assign(defaultRefData(), data.refData) : defaultRefData();
      } else balance = START_BALANCE;
    }catch(e){ balance = START_BALANCE; }
    renderBalance();
  }
  function saveProfile(){
    try{ localStorage.setItem(userKey, JSON.stringify({balance, stats, quests, refData, updated:Date.now()})); }catch(e){}
  }
  function changeBalance(delta){
    balance += delta;
    if(balance < 0) balance = 0;
    renderBalance();
    saveProfile();
  }
  loadProfile();

  // РЕГИСТРАЦИЯ
  function maybeShowRegistration(){
    if(!API_BASE_URL) return;
    if(session && session.token) return;
    const ov = $('regOverlay'); if(ov) ov.classList.add('show');
  }
  const regBtn = $('regSubmitBtn');
  if(regBtn){
    regBtn.addEventListener('click', async ()=>{
      const name = $('regNameInput').value.trim();
      const password = $('regPasswordInput').value;
      $('regError').textContent = '';
      if(name.length < 2){ $('regError').textContent = 'Введи имя (от 2 символов)'; return; }
      if(password.length < 4){ $('regError').textContent = 'Пароль от 4 символов'; return; }
      try{
        const data = await apiRegister(name, password);
        session = {token: data.token, name: data.name};
        saveSession(session);
        balance = data.balance;
        stats = Object.assign(defaultStats(), {
          games:data.games||0, wins:data.wins||0, losses:data.losses||0,
          totalWin:data.total_win||0, totalLose:data.total_lose||0,
          totalWagered:data.total_wagered||0, bestWin:data.best_win||0
        });
        renderBalance(); renderProfile(); saveProfile();
        $('regOverlay').classList.remove('show');
        toast('Добро пожаловать, '+data.name+'!');
        apiActivity('В меню');
      }catch(e){ $('regError').textContent = e.message || 'Не удалось войти'; }
    });
  }
  maybeShowRegistration();

  if(API_BASE_URL){ setInterval(()=>{ if(session) apiSync(); }, 15000); }

  function handleReferralStartParam(){
    if(!tg || !tg.initDataUnsafe) return;
    const startParam = tg.initDataUnsafe.start_param || '';
    if(!startParam || refData.processedStartParam) return;
    if(startParam.startsWith('ref_')){
      const code = startParam.slice(4);
      if(code && code !== refData.code){
        refData.referredBy = code;
        refData.processedStartParam = true;
        saveProfile();
      }
    }
  }
  handleReferralStartParam();

  if(tgUser){
    if($('profileUsername')) $('profileUsername').textContent = tgUser.username ? ('@'+tgUser.username) : (tgUser.first_name || 'Игрок');
    if($('profileTgId')) $('profileTgId').textContent = 'ID: ' + tgUser.id;
  }

  const closeBtn = $('closeBtn');
  if(closeBtn){
    closeBtn.addEventListener('click', ()=>{
      if(tg){ tg.close(); } else { toast('Закрытие доступно внутри Telegram'); }
    });
  }
  let menuTapCount = 0, menuTapTimer = null;
  const menuBtn = $('menuBtn');
  if(menuBtn){
    menuBtn.addEventListener('click', ()=>{
      menuTapCount++;
      clearTimeout(menuTapTimer);
      menuTapTimer = setTimeout(()=>{ menuTapCount = 0; }, 1500);
      if(menuTapCount >= 5){
        menuTapCount = 0;
        openAdminLogin();
        return;
      }
      toast('JAGER · игровая валюта без реальной стоимости');
    });
  }

  const screens = document.querySelectorAll('.screen');
  const navItems = document.querySelectorAll('.nav-item');
  const tabScreenMap = {pvp:'pvp', solo:'solo', giveaways:'giveaways', shop:'shop', referrals:'referrals', profile:'profile'};
  const SCREEN_ACTIVITY_LABELS = {
    solo:'В меню', mines:'Играет в Мины', roulette:'Играет в Рулетку', upgrade:'Играет в Апгрейд',
    rocket:'Играет в Ракету', ladder:'Играет в Лесенку', pvp:'В PvP Battle',
    giveaways:'Смотрит задания', shop:'В магазине', referrals:'В рефералах', profile:'В профиле'
  };
  function showScreen(id){
    screens.forEach(s=>s.classList.remove('active'));
    const scr = $('screen-'+id);
    if(scr) scr.classList.add('active');
    apiActivity(SCREEN_ACTIVITY_LABELS[id] || ('Экран: '+id));
  }
  navItems.forEach(item=>{
    item.addEventListener('click', ()=>{
      navItems.forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      showScreen(tabScreenMap[item.dataset.tab] || 'solo');
    });
  });
  document.querySelectorAll('.game-card').forEach(card=>{
    card.addEventListener('click', ()=> showScreen(card.dataset.game));
  });
  document.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', ()=> showScreen('solo'));
  });

  document.querySelectorAll('[data-half]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const inp = $(b.dataset.half);
      if(!inp) return;
      inp.value = Math.max(1, Math.floor(parseFloat(inp.value||1)/2));
      inp.dispatchEvent(new Event('input'));
    });
  });
  document.querySelectorAll('[data-double]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const inp = $(b.dataset.double);
      if(!inp) return;
      inp.value = Math.max(1, Math.floor(parseFloat(inp.value||1)*2));
      inp.dispatchEvent(new Event('input'));
    });
  });
  function getBet(id){
    const v = Math.floor(parseFloat($(id).value));
    return (isNaN(v) || v < 1) ? 0 : v;
  }

  // ========== MINES ==========
  const MINES_TOTAL = 25;
  let minesState = null;
  function minesMultiplier(mines, revealed){
    let mult = 1; let safe = MINES_TOTAL - mines;
    for(let i=0;i<revealed;i++){ mult *= (MINES_TOTAL - i) / (safe - i); }
    return mult * 0.95;
  }
  function buildMinesGrid(){
    const grid = $('minesGrid'); if(!grid) return;
    grid.innerHTML = '';
    for(let i=0;i<MINES_TOTAL;i++){
      const cell = document.createElement('div');
      cell.className = 'mine-cell'; cell.dataset.idx = i;
      cell.addEventListener('click', onMineCellClick);
      grid.appendChild(cell);
    }
  }
  buildMinesGrid();
  const minesMinus = $('minesMinus'), minesPlus = $('minesPlus'), minesCountEl = $('minesCount');
  if(minesMinus) minesMinus.addEventListener('click', ()=>{
    let n = parseInt(minesCountEl.textContent); if(n>1) minesCountEl.textContent = n-1;
  });
  if(minesPlus) minesPlus.addEventListener('click', ()=>{
    let n = parseInt(minesCountEl.textContent); if(n<24) minesCountEl.textContent = n+1;
  });
  const minesStartBtn = $('minesStartBtn'), minesCashoutBtn = $('minesCashoutBtn');
  if(minesStartBtn) minesStartBtn.addEventListener('click', ()=>{
    const bet = getBet('minesBet');
    if(bet <= 0){ toast('Введите ставку'); return; }
    if(bet > balance){ toast('Недостаточно фишек'); return; }
    const minesCount = parseInt(minesCountEl.textContent);
    changeBalance(-bet);
    const minePositions = new Set();
    while(minePositions.size < minesCount) minePositions.add(Math.floor(Math.random()*MINES_TOTAL));
    minesState = {bet, minesCount, minePositions, revealed:0, active:true};
    document.querySelectorAll('.mine-cell').forEach(c=>{ c.className='mine-cell'; c.textContent=''; });
    const res = $('minesResult'); if(res){ res.className='result-msg'; res.textContent=''; }
    const md = $('minesMultDisplay'); if(md) md.textContent='x1.00';
    minesStartBtn.style.display='none';
    minesCashoutBtn.textContent='Забрать выигрыш';
    minesCashoutBtn.style.display='block';
  });
  function onMineCellClick(e){
    if(!minesState || !minesState.active) return;
    const idx = parseInt(e.currentTarget.dataset.idx);
    const cell = e.currentTarget;
    if(cell.classList.contains('revealed-safe') || cell.classList.contains('revealed-mine')) return;
    if(minesState.minePositions.has(idx)){
      cell.classList.add('revealed-mine'); cell.textContent='💥';
      minesState.active = false; revealAllMines();
      const res = $('minesResult');
      if(res){ res.className='result-msg lose'; res.textContent='Взрыв! Потеряно ' + fmt(minesState.bet) + ' фишек'; }
      recordRoundResult(minesState.bet, 0);
      endMinesRound();
    } else {
      minesState.revealed++;
      cell.classList.add('revealed-safe'); cell.textContent='💎';
      const mult = minesMultiplier(minesState.minesCount, minesState.revealed);
      const md = $('minesMultDisplay'); if(md) md.textContent='x'+mult.toFixed(2);
      minesCashoutBtn.textContent='Забрать ' + fmt(minesState.bet*mult) + ' фишек';
      if(minesState.revealed === MINES_TOTAL - minesState.minesCount) cashoutMines();
    }
  }
  function revealAllMines(){
    document.querySelectorAll('.mine-cell').forEach(c=>{
      const idx = parseInt(c.dataset.idx);
      c.classList.add('locked');
      if(minesState.minePositions.has(idx) && !c.classList.contains('revealed-mine')){
        c.classList.add('revealed-mine'); c.textContent='💣';
      }
    });
  }
  function cashoutMines(){
    if(!minesState || !minesState.active) return;
    const mult = minesMultiplier(minesState.minesCount, minesState.revealed);
    const win = minesState.bet * mult;
    minesState.active = false;
    changeBalance(win);
    const res = $('minesResult');
    if(res){
      res.className='result-msg win';
      res.textContent = minesState.revealed>0 ? ('Выигрыш ' + fmt(win) + ' фишек (x' + mult.toFixed(2) + ')') : 'Ставка возвращена';
    }
    recordRoundResult(minesState.bet, win);
    revealAllMines();
    endMinesRound();
  }
  if(minesCashoutBtn) minesCashoutBtn.addEventListener('click', ()=>{
    if(!minesState || !minesState.active) return;
    if(minesState.revealed === 0){ toast('Откройте хотя бы одну клетку'); return; }
    cashoutMines();
  });
  function endMinesRound(){
    minesCashoutBtn.style.display='none';
    minesStartBtn.style.display='block';
    minesStartBtn.textContent='Начать игру';
  }

  // ========== ROULETTE ==========
  const wheelSegments = [
    {mult:0, color:'#241a45', weight:76},
    {mult:1.2, color:'#3d2678', weight:25},
    {mult:1.5, color:'#6a35b0', weight:18},
    {mult:2, color:'#9257ff', weight:14},
    {mult:3, color:'#c231d9', weight:8},
    {mult:5, color:'#f5479c', weight:4},
    {mult:10, color:'#ffc94a', weight:1},
  ];
  const totalWeight = wheelSegments.reduce((s,x)=>s+x.weight,0);
  function buildWheel(){
    let acc = 0; const gradParts = [];
    wheelSegments.forEach(seg=>{
      const startDeg = acc/totalWeight*360;
      acc += seg.weight;
      const endDeg = acc/totalWeight*360;
      gradParts.push(seg.color+' '+startDeg.toFixed(2)+'deg '+endDeg.toFixed(2)+'deg');
    });
    const wh = $('wheel'); if(wh) wh.style.background = 'conic-gradient(' + gradParts.join(',') + ')';
    const legend = $('wheelLegend'); if(!legend) return;
    legend.innerHTML = '';
    wheelSegments.forEach(seg=>{
      const pill = document.createElement('div');
      pill.className = 'mult-pill';
      pill.style.color = seg.color === '#241a45' ? 'var(--muted)' : seg.color;
      pill.textContent = 'x'+seg.mult;
      legend.appendChild(pill);
    });
  }
  buildWheel();
  let wheelRotation = 0, spinning = false;
  const rouletteSpinBtn = $('rouletteSpinBtn');
  if(rouletteSpinBtn) rouletteSpinBtn.addEventListener('click', ()=>{
    if(spinning) return;
    const bet = getBet('rouletteBet');
    if(bet <= 0){ toast('Введите ставку'); return; }
    if(bet > balance){ toast('Недостаточно фишек'); return; }
    changeBalance(-bet);
    spinning = true;
    const res = $('rouletteResult'); if(res){ res.className='result-msg'; res.textContent=''; }
    rouletteSpinBtn.disabled = true;
    const wc = $('wheelCenter'); if(wc) wc.textContent='...';
    let r = Math.random()*totalWeight;
    let acc = 0, chosen = wheelSegments[0], chosenIdx = 0;
    for(let i=0;i<wheelSegments.length;i++){
      acc += wheelSegments[i].weight;
      if(r <= acc){ chosen = wheelSegments[i]; chosenIdx = i; break; }
    }
    const startW = wheelSegments.slice(0,chosenIdx).reduce((s,x)=>s+x.weight,0);
    const segStartDeg = startW/totalWeight*360;
    const segEndDeg = (startW+chosen.weight)/totalWeight*360;
    const targetDeg = segStartDeg + (segEndDeg-segStartDeg)*0.5;
    const spins = 5 + Math.floor(Math.random()*2);
    const finalRotation = wheelRotation - (wheelRotation % 360) + spins*360 + (360 - targetDeg);
    wheelRotation = finalRotation;
    const wh = $('wheel'); if(wh) wh.style.transform = 'rotate('+finalRotation+'deg)';
    setTimeout(()=>{
      spinning = false;
      rouletteSpinBtn.disabled = false;
      if(wc) wc.textContent = 'x'+chosen.mult;
      const win = bet * chosen.mult;
      if(chosen.mult > 0){
        changeBalance(win);
        if(res){ res.className='result-msg win'; res.textContent='Выпало x'+chosen.mult+' — выигрыш '+fmt(win)+' фишек'; }
        recordRoundResult(bet, win);
      } else {
        if(res){ res.className='result-msg lose'; res.textContent='Выпало x0 — ставка сгорела'; }
        recordRoundResult(bet, 0);
      }
    }, 4300);
  });

  // ========== UPGRADE ==========
  let upgradeNeedleRotation = 0;
  function updateUpgradeUI(){
    const bet = getBet('upgradeBet') || 0;
    const multRaw = parseInt($('upgradeMultSlider').value);
    const mult = multRaw/10;
    const lbl = $('upgradeMultLabel'); if(lbl) lbl.textContent = 'x'+mult.toFixed(2);
    const chance = Math.min(95, Math.max(1, 95/mult));
    const cl = $('upgradeChanceLabel'); if(cl) cl.textContent = chance.toFixed(1)+'%';
    const f = $('upgradeFromVal'); if(f) f.textContent = '◆'+fmt(bet);
    const t = $('upgradeToVal'); if(t) t.textContent = '◆'+fmt(bet*mult);
    const chanceDeg = chance/100*360;
    const g = $('upgradeGauge'); if(g) g.style.background = 'conic-gradient(var(--green) 0deg '+chanceDeg.toFixed(2)+'deg, var(--red) '+chanceDeg.toFixed(2)+'deg 360deg)';
    const gc = $('upgradeGaugeCenter'); if(gc) gc.textContent = chance.toFixed(0)+'%';
  }
  const upgradeBetInp = $('upgradeBet'), upgradeSlider = $('upgradeMultSlider');
  if(upgradeBetInp) upgradeBetInp.addEventListener('input', updateUpgradeUI);
  if(upgradeSlider) upgradeSlider.addEventListener('input', updateUpgradeUI);
  if(upgradeSlider) updateUpgradeUI();
  const upgradeGoBtn = $('upgradeGoBtn');
  if(upgradeGoBtn) upgradeGoBtn.addEventListener('click', ()=>{
    const bet = getBet('upgradeBet');
    if(bet <= 0){ toast('Введите ставку'); return; }
    if(bet > balance){ toast('Недостаточно фишек'); return; }
    const multRaw = parseInt($('upgradeMultSlider').value);
    const mult = multRaw/10;
    const chance = Math.min(95, Math.max(1, 95/mult));
    const chanceDeg = chance/100*360;
    const roll = Math.random()*100;
    const success = roll <= chance;
    const targetDeg = success ? chanceDeg*0.5 : chanceDeg + (360-chanceDeg)*0.5;
    changeBalance(-bet);
    upgradeGoBtn.disabled = true;
    const res = $('upgradeResult'); if(res){ res.className='result-msg'; res.textContent=''; }
    const spins = 3 + Math.floor(Math.random()*2);
    upgradeNeedleRotation = upgradeNeedleRotation - (upgradeNeedleRotation % 360) + spins*360 + targetDeg;
    const nd = $('upgradeNeedle'); if(nd) nd.style.transform = 'translate(-50%,-100%) rotate('+upgradeNeedleRotation+'deg)';
    setTimeout(()=>{
      upgradeGoBtn.disabled = false;
      if(success){
        const win = bet*mult;
        changeBalance(win);
        if(res){ res.className='result-msg win'; res.textContent='Успех! Получено '+fmt(win)+' фишек'; }
        recordRoundResult(bet, win);
      } else {
        if(res){ res.className='result-msg lose'; res.textContent='Неудача — потеряно '+fmt(bet)+' фишек'; }
        recordRoundResult(bet, 0);
      }
    }, 2700);
  });

  // ========== ROCKET ==========
  let rocketInterval = null, rocketCountdownInterval = null;
  let rocketMult = 1, rocketCrashAt = 1;
  let rocketActive = false, rocketBetLocked = 0, rocketPending = false;
  function randomCrashPoint(){
    const RTP = 0.95;
    const r = Math.random();
    const raw = RTP / (1 - r);
    return Math.max(1.01, Math.min(raw, 50));
  }
  function resetRocketVisual(){
    const em = $('rocketEmoji'); if(em){ em.style.left='8%'; em.style.bottom='14px'; em.textContent=''; }
    const md = $('rocketMultDisplay'); if(md){ md.textContent='1.00x'; md.style.color='var(--text)'; }
    const tr = $('rocketTrail'); if(tr) tr.style.height='0%';
    const pa = $('rocketPath'); if(pa) pa.setAttribute('points','0,220');
    const cd = $('rocketCountdown'); if(cd) cd.classList.remove('show');
  }
  function finishRocketLoss(){
    rocketActive = false; rocketPending = false;
    clearInterval(rocketInterval); clearInterval(rocketCountdownInterval);
    const md = $('rocketMultDisplay'); if(md){ md.textContent = rocketCrashAt.toFixed(2)+'x'; md.style.color = 'var(--red)'; }
    const em = $('rocketEmoji'); if(em){ em.style.left = '92%'; em.textContent = '💥'; }
    const st = $('rocketStatus'); if(st) st.textContent = 'Взрыв на '+rocketCrashAt.toFixed(2)+'x';

  function startRocketFlight(){
    rocketPending = false; rocketActive = true;
    rocketCrashAt = randomCrashPoint();
    const cd = $('rocketCountdown'); if(cd) cd.classList.remove('show');
    const st = $('rocketStatus'); if(st) st.textContent = 'В полёте...';
    const cb = $('rocketCashoutBtn'); if(cb){ cb.style.display='block'; cb.disabled=false; }
    const start = Date.now(); const pathPoints = ['0,220'];
    rocketInterval = setInterval(()=>{
      const t = (Date.now()-start)/1000;
      rocketMult = 1 + Math.pow(t, 1.55)*0.22;
      if(rocketMult >= rocketCrashAt){ finishRocketLoss(); return; }
      const md = $('rocketMultDisplay'); if(md){ md.textContent = rocketMult.toFixed(2)+'x'; md.style.color = rocketMult >= 2 ? 'var(--gold)' : 'var(--text)'; }
      const cb = $('rocketCashoutBtn'); if(cb) cb.textContent = 'Забрать '+fmt(rocketBetLocked*rocketMult)+' фишек';
      const heightPct = Math.min(90, (rocketMult-1)*18);
      const widthPct = Math.min(88, 8 + t*14);
      const em = $('rocketEmoji'); if(em){ em.style.left = widthPct + '%'; em.style.bottom = (14+heightPct*2)+'px'; }
      const tr = $('rocketTrail'); if(tr) tr.style.height = heightPct+'%';
      const px = (widthPct/100)*300; const py = 220 - (heightPct/100)*220;
      pathPoints.push(px.toFixed(1)+','+py.toFixed(1));
      if(pathPoints.length > 60) pathPoints.shift();
      const pa = $('rocketPath'); if(pa){ pa.setAttribute('points', pathPoints.join(' ')); pa.style.stroke = (rocketMult >= 2 ? '#ffc94a' : '#33c7ff'); }
    }, 60);
  }

  // ========== LADDER ==========
  const LADDER_LEVELS = 6, LADDER_CELLS = 3, LADDER_MINES = 1;
  function ladderMultAt(level){
    const base = LADDER_CELLS / (LADDER_CELLS - LADDER_MINES);
    return Math.pow(base, level) * 0.95;
  }
  let ladderState = null;
  function renderLadderLevels(){
    const wrap = $('ladderLevels'); if(!wrap) return;
    wrap.innerHTML = '';
    for(let lvl=1; lvl<=LADDER_LEVELS; lvl++){
      const row = document.createElement('div');
      row.className = 'ladder-level-row'; row.id = 'ladderLvl'+lvl;
      row.innerHTML = '<span>Уровень '+lvl+'</span><b>x'+ladderMultAt(lvl).toFixed(2)+'</b>';
      wrap.appendChild(row);
    }
  }
  renderLadderLevels();
  function updateLadderLevelStyles(){
    for(let lvl=1; lvl<=LADDER_LEVELS; lvl++){
      const row = $('ladderLvl'+lvl); if(!row) continue;
      row.className = 'ladder-level-row' +
        (ladderState && lvl <= ladderState.level ? ' passed' : '') +
        (ladderState && ladderState.active && lvl === ladderState.level+1 ? ' current' : '');
    }
  }
  function buildLadderRow(){
    const row = $('ladderRow'); if(!row) return;
    row.innerHTML = '';
    for(let i=0;i<LADDER_CELLS;i++){
      const cell = document.createElement('div');
      cell.className = 'ladder-cell'; cell.dataset.idx = i; cell.textContent = '❔';
      cell.addEventListener('click', onLadderCellClick);
      row.appendChild(cell);
    }
  }
  buildLadderRow();
  const ladderStartBtn = $('ladderStartBtn'), ladderCashoutBtn = $('ladderCashoutBtn');
  if(ladderStartBtn) ladderStartBtn.addEventListener('click', ()=>{
    const bet = getBet('ladderBet');
    if(bet <= 0){ toast('Введите ставку'); return; }
    if(bet > balance){ toast('Недостаточно фишек'); return; }
    changeBalance(-bet);
    ladderState = {bet, level:0, active:true};
    document.querySelectorAll('.ladder-cell').forEach(c=>{ c.className='ladder-cell'; c.textContent='❔'; });
    const res = $('ladderResult'); if(res){ res.className='result-msg'; res.textContent=''; }
    const md = $('ladderMultDisplay'); if(md) md.textContent='x1.00';
    ladderStartBtn.style.display='none';
    ladderCashoutBtn.textContent='Забрать выигрыш';
    ladderCashoutBtn.style.display='block';
    updateLadderLevelStyles();
  });
  function onLadderCellClick(e){
    if(!ladderState || !ladderState.active) return;
    const cells = document.querySelectorAll('.ladder-cell');
    const minePos = Math.floor(Math.random()*LADDER_CELLS);
    const idx = parseInt(e.currentTarget.dataset.idx);
    cells.forEach(c=> c.classList.add('locked'));
    if(idx === minePos){
      e.currentTarget.classList.add('mine'); e.currentTarget.textContent = '💣';
      cells.forEach((c,i)=>{ if(i!==idx){ c.textContent = '🟩'; c.classList.add('safe'); } });
      ladderState.active = false;
      const res = $('ladderResult'); if(res){ res.className='result-msg lose'; res.textContent = 'Мина! Потеряно ' + fmt(ladderState.bet) + ' фишек'; }
      recordRoundResult(ladderState.bet, 0);
      endLadderRound();
    } else {
      e.currentTarget.classList.add('safe'); e.currentTarget.textContent = '💎';
      ladderState.level++;
      const mult = ladderMultAt(ladderState.level);
      const md = $('ladderMultDisplay'); if(md) md.textContent='x'+mult.toFixed(2);
      ladderCashoutBtn.textContent = 'Забрать ' + fmt(ladderState.bet*mult) + ' фишек';
      updateLadderLevelStyles();
      if(ladderState.level >= LADDER_LEVELS) cashoutLadder();
      else setTimeout(buildLadderRow, 550);
    }
  }
  function cashoutLadder(){
    if(!ladderState || !ladderState.active) return;
    const mult = ladderMultAt(ladderState.level);
    const win = ladderState.bet * mult;
    ladderState.active = false;
    changeBalance(win);
    const res = $('ladderResult');
    if(res){
      res.className='result-msg win';
      res.textContent = ladderState.level>0 ? ('Выигрыш ' + fmt(win) + ' фишек (x' + mult.toFixed(2) + ')') : 'Ставка возвращена';
    }
    recordRoundResult(ladderState.bet, win);
    endLadderRound();
  }
  if(ladderCashoutBtn) ladderCashoutBtn.addEventListener('click', ()=>{
    if(!ladderState || !ladderState.active) return;
    if(ladderState.level === 0){ toast('Сделайте хотя бы один шаг'); return; }
    cashoutLadder();
  });
  function endLadderRound(){
    ladderCashoutBtn.style.display='none';
    ladderStartBtn.style.display='block';
    ladderStartBtn.textContent='Начать игру';

  const pvpFindBtn = $('pvpFindBtn'), pvpCancelBtn = $('pvpCancelBtn');
  if(pvpFindBtn) pvpFindBtn.addEventListener('click', ()=>{

    changeBalance(-bet);

    if($('pvpP1Bet')) $('pvpP1Bet').textContent='◆'+fmt(bet);
    const WAIT_SECONDS = 20;
    let secondsLeft = WAIT_SECONDS;
    const st = $('pvpStatus'); if(st) st.textContent='Ищем соперника... ' + secondsLeft + ' сек';
    const matchAtSecond = 3 + Math.random()*(WAIT_SECONDS-3);
    pvpWaitInterval = setInterval(()=>{
      secondsLeft--;
      if(wf) wf.style.width = Math.max(0, (secondsLeft/WAIT_SECONDS)*100) + '%';
      if(secondsLeft > 0 && st) st.textContent = 'Ищем соперника... ' + secondsLeft + ' сек';
      if(secondsLeft <= 0) clearInterval(pvpWaitInterval);
    }, 1000);
    pvpMatchTimeout = setTimeout(()=>{
      clearInterval(pvpWaitInterval);
      const oppBet = Math.max(10, Math.round(bet * (0.5 + Math.random()*1.3)));
      startPvpBattle(bet, oppBet);
    }, matchAtSecond*1000);
  });
  if(pvpCancelBtn) pvpCancelBtn.addEventListener('click', ()=>{
    if(!pvpBusy) return;
    clearInterval(pvpWaitInterval); clearTimeout(pvpMatchTimeout);
    changeBalance(pvpCurrentBet);

  function startPvpBattle(bet, oppBet){
    const p1Pct = Math.round((bet/(bet+oppBet))*1000)/10;
    const p2Pct = Math.round(1000-p1Pct*10)/10;
    const wt = $('pvpWaitTrack'); if(wt) wt.style.display='none';
    pvpCancelBtn.style.display='none';
    if($('pvpP1Bet')) $('pvpP1Bet').textContent='◆'+fmt(bet);
    if($('pvpP2Bet')) $('pvpP2Bet').textContent='◆'+fmt(oppBet);
    if($('pvpP1Pct')) $('pvpP1Pct').textContent=p1Pct+'%';
    if($('pvpP2Pct')) $('pvpP2Pct').textContent=p2Pct+'%';
    if($('pvpBarP1')) $('pvpBarP1').style.width=p1Pct+'%';
    if($('pvpBarP2')) $('pvpBarP2').style.width=p2Pct+'%';
    const st = $('pvpStatus'); if(st) st.textContent='Соперник найден! Бой начинается...';
    setTimeout(()=>{
      const roll = Math.random()*100;
      const p1wins = roll <= p1Pct;
      const bank = bet + oppBet;
      const commission = bank * 0.05;
      const payout = bank - commission;
      const rc = $('pvpResultCard');
      if(rc){
        rc.className = 'pvp-result-card show ' + (p1wins ? 'win' : 'lose');
        if(p1wins){
          changeBalance(payout);
          $('pvpResultBig').textContent = '🏆 Победа!';
          $('pvpResultSmall').textContent = 'Банк ' + fmt(bank) + ' минус 5% комиссии = получено ' + fmt(payout) + ' фишек';
          recordRoundResult(bet, payout);
        } else {
          $('pvpResultBig').textContent = '💥 Поражение';
          $('pvpResultSmall').textContent = 'Соперник забрал банк — потеряно ' + fmt(bet) + ' фишек';
          recordRoundResult(bet, 0);
        }
      }
      if(st) st.textContent = 'Матч завершён';
      pvpFindBtn.style.display='block';
      pvpFindBtn.textContent='Найти соперника снова';
      pvpBusy = false;
    }, 1600);
  }

    const rank = currentRank();
    const nxt = nextRank();
    set('profileRankBadge', rank.emoji+' '+rank.name);
    set('topRankBadge', rank.emoji+' '+rank.name);
    set('rankCurrentLabel', rank.emoji+' '+rank.name);
    if(nxt){
      set('rankNextLabel', 'до '+nxt.name+': ◆'+fmt(Math.max(0,nxt.min-stats.totalEarned)));
      const span = nxt.min - rank.min;
      const progressed = Math.min(100, Math.max(0, (stats.totalEarned-rank.min)/span*100));
      const fill = $('rankProgressFill'); if(fill) fill.style.width = progressed+'%';
    } else {
      set('rankNextLabel', 'максимальный ранг');
      const fill = $('rankProgressFill'); if(fill) fill.style.width = '100%';
    }
  }
  renderProfile();

  // ========== ADMIN PANEL ==========
  let adminToken = sessionStorage.getItem(ADMIN_TOKEN_KEY) || null;
  function openAdminLogin(){
    const ov = $('adminLoginOverlay'); if(ov) ov.classList.add('show');
    const inp = $('adminPasswordInput'); if(inp){ inp.value = ''; inp.focus(); }
  }
  const adminLoginBtn = $('adminLoginBtn');
  if(adminLoginBtn) adminLoginBtn.addEventListener('click', tryAdminLogin);
  const adminPwdInp = $('adminPasswordInput');
  if(adminPwdInp) adminPwdInp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAdminLogin(); });
  async function tryAdminLogin(){
    const val = $('adminPasswordInput').value;
    if(!val){ toast('Введите пароль'); return; }
    try{
      const token = await apiAdminLogin(val);
      adminToken = token;
      sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
      $('adminLoginOverlay').classList.remove('show');
      openAdminPanel();
      toast('Вход выполнен');
    }catch(e){ toast('Неверный пароль'); }
  }
  function openAdminPanel(){
    if(!adminToken){ openAdminLogin(); return; }
    renderAdminPanel();
    const as = $('adminScreen'); if(as) as.classList.add('show');
    clearInterval(adminPollTimer);
    if(API_BASE_URL) adminPollTimer = setInterval(()=> renderAdminPlayers(currentAdminView), 5000);
  }
  const adminCloseBtn = $('adminCloseBtn');
  if(adminCloseBtn) adminCloseBtn.addEventListener('click', ()=>{
    const as = $('adminScreen'); if(as) as.classList.remove('show');
    clearInterval(adminPollTimer);
  });
  const adminLogoutBtn = $('adminLogoutBtn');
  if(adminLogoutBtn) adminLogoutBtn.addEventListener('click', ()=>{
    adminToken = null;
    sessionStorage.removeItem(ADMIN_TOKEN_KEY);
    const as = $('adminScreen'); if(as) as.classList.remove('show');
    clearInterval(adminPollTimer);
    toast('Выход из админ-панели выполнен');
  });
  let currentAdminView = 'players';
  let adminPollTimer = null;
  async function renderAdminPlayers(view='players'){
    currentAdminView = view;
    if(!API_BASE_URL || !adminToken) return;
    try{
      const sortParam = view==='balance' ? 'balance' : (view==='games' ? 'games' : 'recent');
      const res = await fetch(API_BASE_URL + '/api/admin/players?admin_token=' + encodeURIComponent(adminToken) + '&sort=' + sortParam);
      if(res.status === 403){ adminToken=null; sessionStorage.removeItem(ADMIN_TOKEN_KEY); openAdminLogin(); return; }
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      const setT = (id, v)=>{ const el = $(id); if(el) el.textContent = v; };
      setT('adminTotalPlayers', data.total_players);
      setT('adminOnlinePlayers', data.online_now);
      setT('adminTotalGames', data.total_games);
      setT('adminTotalWagered', '◆'+fmt(data.total_wagered));
      let html = '<table class="admin-table"><thead><tr><th>#</th><th>Игрок</th><th>Сейчас</th><th>Баланс</th><th>Игр</th><th>Побед</th><th>Статус</th></tr></thead><tbody>';
      data.players.forEach((p,i)=>{
        html += '<tr><td>'+(i+1)+'</td>'+
          '<td>'+(p.online?'<span class="admin-online-dot"></span>':'')+p.name+'</td>'+
          '<td class="admin-muted">'+p.activity+'</td>'+
          '<td>◆'+fmt(p.balance)+'</td><td>'+p.games+'</td><td>'+p.wins+'</td>'+
          '<td>'+(p.banned?' 🔒':'✅')+'</td></tr>';
      });
      html += '</tbody></table>';
      const tbl = $('adminPlayersTable'); if(tbl) tbl.innerHTML = html;
    }catch(e){
      const tbl = $('adminPlayersTable');
      if(tbl) tbl.innerHTML = '<div class="admin-note">Сервер недоступен ('+API_BASE_URL+')</div>';
    }
  }
  function renderAdminPanel(){
    const q = $('adminQuestQueue');
    if(q){
      q.innerHTML = '';
      const pendingItems = [];
      if(quests.adminMsgDone === 'pending') pendingItems.push({key:'adminMsgDone', label:'Сообщение администратору', reward:1000});
      if(quests.channelDone === 'pending') pendingItems.push({key:'channelDone', label:'Подписка на канал', reward:3000});
      if(pendingItems.length === 0) q.innerHTML = '<div class="admin-note">Заявок на проверку нет</div>';
      else {
        pendingItems.forEach(it=>{
          const row = document.createElement('div'); row.className='admin-row';
          row.innerHTML='<span>'+it.label+' (+'+fmt(it.reward)+')</span><button class="admin-approve-btn" data-key="'+it.key+'" data-reward="'+it.reward+'">Подтвердить</button>';
          q.appendChild(row);
        });
        q.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{
          const key=btn.dataset.key, reward=parseInt(btn.dataset.reward);
          quests[key]=true; changeBalance(reward);
          toast('Задание подтверждено, начислено '+fmt(reward));
          renderQuests(); saveProfile(); renderAdminPanel();
        }));
      }
    }
    const s = $('adminStatsBlock');
    if(s){
      s.innerHTML =
        '<div class="admin-row"><span>ID</span><b>'+(tgUser?tgUser.id:'—')+'</b></div>'+
        '<div class="admin-row"><span>Баланс</span><b>◆'+fmt(balance)+'</b></div>'+
        '<div class="admin-row"><span>Игр сыграно</span><b>'+stats.games+'</b></div>'+
        '<div class="admin-row"><span>Ставок на сумму</span><b>◆'+fmt(stats.totalWagered||0)+'</b></div>'+
        '<div class="admin-row"><span>Победы / поражения</span><b>'+stats.wins+' / '+stats.losses+'</b></div>'+
        '<div class="admin-row"><span>Win Rate</span><b>'+(stats.games>0?Math.round(stats.wins/stats.games*100):0)+'%</b></div>';
    }
    renderAdminPlayers('players');
    document.querySelectorAll('.admin-tab').forEach(tab=>{
      tab.onclick=()=>{
        document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));
        tab.classList.add('active');
        renderAdminPlayers(tab.dataset.adminView);
      };
    });
  }
  const adminGiveBtn = $('adminGiveBtn');
  if(adminGiveBtn) adminGiveBtn.addEventListener('click', async ()=>{
    const target = $('adminGiveTarget').value.trim();
    const amount = parseInt($('adminGiveAmount').value);
    if(!target){ toast('Укажите имя игрока'); return; }
    if(!amount || amount <= 0){ toast('Укажите сумму'); return; }
    if(!adminToken){ toast('Сначала войдите в админ-панель'); return; }
    try{
      const res = await fetch(API_BASE_URL + '/api/admin/give', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({admin_token: adminToken, name: target, amount})
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.detail || 'Ошибка');
      toast('Игроку '+target+' начислено ◆'+fmt(amount)+'. Увидит фишки при следующей синхронизации (до 15 сек)');
      $('adminGiveTarget').value=''; $('adminGiveAmount').value='';
      renderAdminPlayers(currentAdminView);
    }catch(e){ toast('Не удалось начислить: '+e.message); }
  });
  const adminBanBtn = $('adminBanBtn');
  if(adminBanBtn) adminBanBtn.addEventListener('click', async ()=>{
    const target = $('adminBanTarget').value.trim();
    const minutes = parseInt($('adminBanMinutes').value);
    if(!target){ toast('Укажите имя'); return; }
    if(isNaN(minutes)){ toast('Укажите минуты'); return; }
    if(!adminToken){ toast('Сначала войдите'); return; }
    try{
      const res = await fetch(API_BASE_URL + '/api/admin/ban', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({admin_token: adminToken, name: target, minutes})
      });
      if(!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || 'Ошибка');
      toast('Игрок '+target+' забанен');
      renderAdminPlayers(currentAdminView);
    }catch(e){ toast('Не удалось: '+e.message); }
  });

})();
</script>
